<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>AI Card Draft</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    textarea { width: 100%; height: 300px; font-family: monospace; margin-bottom: 10px; }
    button { padding: .6rem 1.2rem; font-size: 1rem; cursor: pointer; margin-right: 10px; }
    .warnings { background: #fff3cd; border: 1px solid #ffecb5; padding: 10px; border-radius: 5px; margin-bottom: 1rem; color: #856404; }
    .result-box { background: #f4f4f4; padding: 1rem; overflow-x: auto; white-space: pre-wrap; border-radius: 5px; border: 1px solid #ddd; }
    .status-error { color: red; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Черновик карточки товара</h1>
  <p>Вставьте JSON товара и нажмите «Сгенерировать».</p>

  <textarea id="in">{
  "name": "Манометр показывающий DM 02",
  "manufacturer": "Манотомь",
  "specs": {
    "диапазон измерений": "0–1,6 МПа",
    "класс точности": "1,5",
    "присоединение": "G1/2",
    "диаметр корпуса": "100 мм"
  },
  "description": "Прибор предназначен для измерения избыточного давления."
}</textarea>

  <button onclick="go()">Сгенерировать</button>

  <div id="warnings-area"></div>

  <h2>Готовый текст (для копирования)</h2>
  <div id="result" class="result-box">Здесь появится результат...</div>
  <br>
  <button onclick="copyOut()" id="copy-btn" style="display:none;">📋 Скопировать текст</button>

<script>
async function go() {
  const out = document.getElementById('result');
  const warningsArea = document.getElementById('warnings-area');
  const copyBtn = document.getElementById('copy-btn');

  out.textContent = 'Генерация... Пожалуйста, подождите (локальной модели нужно время).';
  out.className = 'result-box';
  warningsArea.innerHTML = '';
  copyBtn.style.display = 'none';

  let body;
  try { body = JSON.parse(document.getElementById('in').value); }
  catch (e) { out.textContent = 'Некорректный JSON: ' + e.message; out.className = 'status-error'; return; }

  const r = await fetch('/generate', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body),
  });

  const data = await r.json();

  if (data.detail) {
      out.textContent = "Ошибка: " + data.detail;
      out.className = 'status-error';
      return;
  }

  // Показываем предупреждения, если есть
  if (data.warnings && data.warnings.length > 0) {
      warningsArea.innerHTML = '<div class="warnings"><b>⚠️ Замечания к генерации:</b><br>' + data.warnings.join('<br>') + '</div>';
  }

  // Если данных не хватает
  if (data.status === 'needs_clarification') {
      out.textContent = 'Не хватает полей: ' + data.missing_fields.join(', ');
      out.className = 'status-error';
      return;
  }

  // Выводим чистый markdown
  if (data.status === 'ok') {
      out.textContent = data.markdown;
      out.className = 'result-box';
      copyBtn.style.display = 'inline-block';
  }
}

function copyOut() {
  const text = document.getElementById('result').textContent;
  navigator.clipboard.writeText(text);

  const btn = document.getElementById('copy-btn');
  btn.textContent = '✅ Скопировано!';
  setTimeout(() => btn.textContent = '📋 Скопировать текст', 2000);
}
</script>
</body>
</html>
